<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/duck.svg" />
    <link rel="preload" as="image" href="/logo.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ducksoup</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const theme = localStorage.getItem('theme');
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        // Unregister leftover Workbox SW from the reverted PWA. Does not
        // help until this HTML is fetched from the network; public/sw.js
        // is what replaces a still-controlling worker.
        if ('serviceWorker' in navigator) {
          void navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const reg of regs) void reg.unregister();
          });
        }
        if (window.caches) {
          void caches.keys().then((keys) => {
            for (const key of keys) void caches.delete(key);
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
